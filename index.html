<!DOCTYPE html>
<html lang="tk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bije Biletlarynyň Sanawy</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-free: #10b981;
      --accent-taken: #ef4444;
      --border-color: #334155;
    }

    .light-mode {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border-color: #cbd5e1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; transition: background 0.3s, color 0.3s; }
    body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-main); padding: 20px; }

    .top-bar { display: flex; justify-content: space-between; align-items: center; max-width: 1100px; margin: 0 auto 20px; }
    .btn-toggle { background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }

    .header { text-align: center; margin-bottom: 25px; }
    .header h1 { font-size: 2rem; font-weight: 700; margin-bottom: 10px; color: #38bdf8; }
    .header p { color: var(--text-sub); font-size: 1rem; max-width: 600px; margin: 0 auto; line-height: 1.5; }

    .progress-container { max-width: 600px; margin: 20px auto; background: var(--card-bg); border-radius: 20px; height: 16px; overflow: hidden; border: 1px solid var(--border-color); }
    .progress-bar { height: 100%; background: linear-gradient(90deg, #10b981, #38bdf8); width: 0%; transition: width 0.5s ease-in-out; }

    .controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 25px; max-width: 800px; margin-left: auto; margin-right: auto; }
    .input-search, .select-filter { padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-main); font-size: 0.9rem; outline: none; }
    .input-search { flex: 1; min-width: 200px; }

    .stats-container { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; flex-wrap: wrap; }
    .stat-box { background: var(--card-bg); border: 1px solid var(--border-color); padding: 10px 18px; border-radius: 10px; font-weight: 600; font-size: 0.85rem; }
    .stat-free { color: var(--accent-free); }
    .stat-taken { color: var(--accent-taken); }

    .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; max-width: 1100px; margin: 0 auto; }

    .ticket-card {
      background: var(--card-bg);
      border: 2px dashed var(--border-color);
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      position: relative;
    }

    .ticket-card:hover { transform: translateY(-4px); box-shadow: 0 8px 16px rgba(0,0,0,0.2); }
    .ticket-number { font-size: 1.2rem; font-weight: 700; margin-bottom: 6px; }

    .badge { display: inline-block; padding: 4px 8px; font-size: 0.7rem; font-weight: 700; border-radius: 20px; text-transform: uppercase; margin-bottom: 8px; }
    .badge-bos { background: rgba(16, 185, 129, 0.15); color: var(--accent-free); border: 1px solid var(--accent-free); }
    .badge-bilet { background: rgba(239, 68, 68, 0.15); color: var(--accent-taken); border: 1px solid var(--accent-taken); }

    .user-info { font-size: 0.78rem; color: var(--text-sub); margin-bottom: 8px; min-height: 28px; }
    .user-info strong { color: var(--text-main); display: block; }

    .btn-wa { display: inline-block; background: #25D366; color: #fff; text-decoration: none; padding: 5px 10px; font-size: 0.75rem; font-weight: 600; border-radius: 6px; }
  </style>
</head>
<body>

  <div class="top-bar">
    <button class="btn-toggle" onclick="toggleTheme()">☀️ / 🌙 Tema</button>
    <button class="btn-toggle" onclick="toggleLang()" id="lang-btn">🇹🇲 TK / 🇹🇷 TR</button>
  </div>

  <div class="header">

  </div>

  <div class="progress-container">
    <div class="progress-bar" id="progress-bar"></div>
  </div>

  <div class="controls">
