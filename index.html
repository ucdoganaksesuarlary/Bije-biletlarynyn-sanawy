<!DOCTYPE html>
<html lang="tk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bilet Barla - Şansly Bilet Ulgamy</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(22, 31, 49, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.4);
      --accent-green: #10b981;
      --accent-red: #f43f5e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --banner-bg: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(168, 85, 247, 0.2));
    }

    body.light-mode {
      --bg-color: #f1f5f9;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(0, 0, 0, 0.08);
      --primary: #4f46e5;
      --primary-glow: rgba(79, 70, 229, 0.25);
      --accent-green: #059669;
      --accent-red: #e11d48;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --banner-bg: linear-gradient(135deg, rgba(79, 70, 229, 0.1), rgba(168, 85, 247, 0.1));
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; transition: background-color 0.3s, color 0.3s, border-color 0.3s; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .splash-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, #1e1b4b 0%, #0b0f19 100%);
      z-index: 99999;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; padding: 25px;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    .splash-overlay.hidden { 
      opacity: 0; 
      visibility: hidden; 
      display: none !important;
    }

    .splash-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      padding: 40px 30px;
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(99, 102, 241, 0.2);
      animation: floatUp 0.8s ease-out;
      max-width: 380px; width: 100%;
    }

    .splash-icon { font-size: 48px; margin-bottom: 15px; display: inline-block; animation: pulse 1.5s infinite; }
    .splash-title {
      font-size: 24px; font-weight: 800;
      background: linear-gradient(135deg, #818cf8, #c084fc, #34d399);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 12px; line-height: 1.3;
    }
    .splash-sub { 
      color: #94a3b8; font-size: 13px; font-weight: 600; 
      letter-spacing: 2px; text-transform: uppercase;
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 14px; border-radius: 20px; display: inline-block;
    }

    .container { width: 100%; max-width: 950px; }
    .marquee-container {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 12px; overflow: hidden; white-space: nowrap;
      margin-bottom: 15px; padding: 8px 0; display: flex; align-items: center;
    }
    .marquee-label {
      background: var(--primary); color: #fff; padding: 4px 10px;
      font-size: 11px; font-weight: 800; border-radius: 8px; margin: 0 10px; flex-shrink: 0;
    }
    .marquee-content { display: inline-block; animation: marquee 25s linear infinite; font-size: 13px; font-weight: 700; }
    .marquee-item { margin-right: 30px; color: var(--accent-green); text-shadow: 0 0 8px rgba(16, 185, 129, 0.4); }

    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .theme-toggle, .lang-select, .btn-action {
      background: var(--card-bg); border: 1px solid var(--card-border);
      color: var(--text-main); padding: 8px 14px; border-radius: 12px;
      font-weight: 600; font-size: 13px; cursor: pointer; backdrop-filter: blur(10px);
    }
    .lang-select option { background: var(--bg-color); color: var(--text-main); }

    .welcome-banner {
      background: var(--banner-bg); border: 1px solid var(--card-border);
      backdrop-filter: blur(12px); border-radius: 20px; padding: 22px;
      text-align: center; margin-bottom: 25px; animation: fadeInDown 0.8s ease-out;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }
    .welcome-banner h2 {
      font-size: 22px; font-weight: 800; margin-bottom: 6px;
      background: linear-gradient(135deg, var(--primary), #a855f7);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .welcome-banner p { font-size: 14px; color: var(--text-muted); }

    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }

    .progress-wrapper { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 12px; margin-bottom: 20px; }
    .progress-info { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
    .progress-bar-bg { background: rgba(0,0,0,0.2); height: 8px; border-radius: 10px; overflow: hidden; }
    .progress-bar-fill { background: linear-gradient(90deg, var(--primary), var(--accent-green)); height: 100%; width: 0%; transition: width 0.5s ease; }

    .stats-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
    .stat-card {
      background: var(--card-bg); backdrop-filter: blur(12px);
      border: 1px solid var(--card-border); border-radius: 16px; padding: 16px;
      text-align: center; position: relative; overflow: hidden; animation: zoomIn 0.5s ease;
    }
    .stat-card .num { font-size: 22px; font-weight: 800; margin-top: 6px; }

    .controls-card {
      background: var(--card-bg); backdrop-filter: blur(12px);
      border: 1px solid var(--card-border); border-radius: 20px; padding: 16px 20px;
      margin-bottom: 25px; display: flex; flex-wrap: wrap; gap: 15px;
      justify-content: space-between; align-items: center;
    }
    .search-box { flex: 1; min-width: 200px; }
    .search-box input {
      width: 100%; background: rgba(0, 0, 0, 0.15); border: 1px solid var(--card-border);
      border-radius: 12px; padding: 12px 18px; color: var(--text-main); font-size: 14px; outline: none;
    }
    .search-box input:focus { border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }

    .filter-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-filter {
      background: rgba(0, 0, 0, 0.15); border: 1px solid var(--card-border);
      color: var(--text-muted); padding: 10px 18px; border-radius: 12px;
      font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .btn-filter.active { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 4px 15px var(--primary-glow); }

    .tickets-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 14px; min-height: 200px; }
    .ticket-card {
      background: var(--card-bg); backdrop-filter: blur(8px);
      border: 1px solid var(--card-border); border-radius: 16px; padding: 14px;
      text-align: center; position: relative; cursor: pointer; animation: fadeInUp 0.4s ease-out;
    }
    .ticket-card:hover { transform: translateY(-5px) scale(1.02); box-shadow: 0 10px 20px var(--primary-glow); }
    .ticket-card.free { border-top: 3px solid var(--accent-green); }
    .ticket-card.sold { border-top: 3px solid var(--accent-red); }

    .ticket-number { font-size: 17px; font-weight: 800; margin-bottom: 6px; }
    .ticket-status { font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 4px 10px; border-radius: 20px; display: inline-block; margin-bottom: 10px; }
    .free .ticket-status { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); }
    .sold .ticket-status { background: rgba(244, 63, 94, 0.15); color: var(--accent-red); }

    .owner-info { font-size: 11px; color: var(--text-muted); border-top: 1px dashed var(--card-border); padding-top: 8px; text-align: left; }
    .owner-info span { display: block; color: var(--text-main); font-weight: 600; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(5px);
      display: flex; justify-content: center; align-items: center;
      opacity: 0; pointer-events: none; transition: all 0.3s ease; z-index: 1000;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-content {
      background: var(--bg-color); border: 1px solid var(--card-border);
      border-radius: 20px; padding: 25px; width: 90%; max-width: 450px;
      text-align: center; transform: translateY(20px); transition: all 0.3s ease;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .modal-overlay.active .modal-content { transform: translateY(0); }
    .modal-tickets-list { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 15px 0; max-height: 150px; overflow-y: auto; }
    .modal-ticket-badge { background: var(--primary); color: #fff; padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 700; }

    .pagination-container { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 35px; flex-wrap: wrap; }
    .btn-page {
      background: var(--card-bg); border: 1px solid var(--card-border);
      color: var(--text-main); padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: 600;
    }
    .btn-page:hover:not(:disabled) { background: var(--primary); color: #fff; }
    .btn-page:disabled { opacity: 0.3; cursor: not-allowed; }

    .jump-input {
      width: 70px; background: rgba(0,0,0,0.15); border: 1px solid var(--card-border);
      border-radius: 8px; color: var(--text-main); text-align: center; padding: 8px; font-weight: 600;
    }

    .whatsapp-btn {
      position: fixed; bottom: 20px; right: 20px;
      background: #25d366; color: #fff; padding: 12px 18px; border-radius: 50px;
      text-decoration: none; font-weight: 700; font-size: 13px;
      box-shadow: 0 8px 20px rgba(37, 211, 102, 0.4); display: flex; align-items: center; gap: 8px; z-index: 900;
      transition: transform 0.2s;
    }
    .whatsapp-btn:hover { transform: scale(1.05); }

    footer { text-align: center; color: var(--text-muted); font-size: 12px; margin-top: 40px; padding: 20px 0; }

    @keyframes floatUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes zoomIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

    @media print {
      body { background: #fff; color: #000; padding: 0; }
      .top-bar, .welcome-banner, .controls-card, .pagination-container, .whatsapp-btn, .theme-toggle, .marquee-container, .splash-overlay { display: none !important; }
      .ticket-card { border: 1px solid #000 !important; color: #000 !important; page-break-inside: avoid; }
    }
  </style>
</head>
