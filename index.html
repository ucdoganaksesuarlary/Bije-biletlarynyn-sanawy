<!DOCTYPE html>
<html lang="tk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bilet Barla - Şansly Bilet Ulgamy</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(22, 31, 49, 0.65);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.35);
      --accent-green: #10b981;
      --accent-green-glow: rgba(16, 185, 129, 0.25);
      --accent-red: #f43f5e;
      --accent-red-glow: rgba(244, 63, 94, 0.25);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(at 10% 10%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 90% 90%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding: 30px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 950px;
    }

    .header {
      text-align: center;
      margin-bottom: 35px;
    }

    .header h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }

    .header p {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 8px;
      font-weight: 500;
    }

    /* STATS CARD DESIGN */
    .stats-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 3px;
    }

    .stat-card.all::before { background: linear-gradient(90deg, #6366f1, #a855f7); }
    .stat-card.sold::before { background: linear-gradient(90deg, #f43f5e, #fb7185); }
    .stat-card.free::before { background: linear-gradient(90deg, #10b981, #34d399); }

    .stat-card .num { 
      font-size: 22px; 
      font-weight: 800; 
      margin-top: 6px; 
    }
    .stat-card.all .num { color: #c7d2fe; }
    .stat-card.sold .num { color: #fecdd3; }
    .stat-card.free .num { color: #a7f3d0; }

    /* CONTROLS CARD */
    .controls-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px 20px;
      margin-bottom: 25px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
    }

    .search-box {
      flex: 1;
      min-width: 260px;
    }

    .search-box input {
      width: 100%;
      background: rgba(11, 15, 25, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 18px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.3s ease;
    }

    .search-box input:focus { 
      border-color: var(--primary);
      box-shadow: 0 0 15px var(--primary-glow);
    }

    .filter-buttons {
      display: flex;
      gap: 8px;
    }

    .btn-filter {
      background: rgba(11, 15, 25, 0.6);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-filter:hover {
      color: #fff;
      border-color: rgba(255,255,255,0.2);
    }

    .btn-filter.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 4px 15px var(--primary-glow);
    }

    /* TICKETS GRID & TICKET CARDS */
    .tickets-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
      gap: 14px;
      min-height: 200px;
    }

    .ticket-card {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px;
      text-align: center;
      position: relative;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    .ticket-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.4);
    }

    .ticket-card.free { 
      border-top: 3px solid var(--accent-green); 
    }

    .ticket-card.free:hover {
      border-color: var(--accent-green);
      box-shadow: 0 6px 20px var(--accent-green-glow);
    }

    .ticket-card.sold { 
      border-top: 3px solid var(--accent-red); 
      background: rgba(244, 63, 94, 0.04);
    }

    .ticket-card.sold:hover {
      border-color: var(--accent-red);
      box-shadow: 0 6px 20px var(--accent-red-glow);
    }

    .ticket-number {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }

    .ticket-status {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 4px 10px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 10px;
    }

    .free .ticket-status { 
      background: rgba(16, 185, 129, 0.12); 
      color: var(--accent-green); 
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    .sold .ticket-status { 
      background: rgba(244, 63, 94, 0.12); 
      color: var(--accent-red); 
      border: 1px solid rgba(244, 63, 94, 0.2);
    }

    .owner-info {
      font-size: 11px;
      color: var(--text-muted);
      border-top: 1px dashed rgba(255, 255, 255, 0.1);
      padding-top: 8px;
      text-align: left;
    }

    .owner-info span { 
      display: block; 
      color: var(--text-main); 
      font-weight: 600; 
      font-size: 12px; 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis; 
    }

    /* PAGINATION DESIGN */
    .pagination-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-top: 35px;
    }

    .btn-page {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 10px 20px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.3s ease;
    }

    .btn-page:hover:not(:disabled) {
      background: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 4px 15px var(--primary-glow);
    }

    .btn-page:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      margin-top: 40px;
      padding: 20px 0;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>BİLET SANAW ULGAMY</h1>
    <p>1-den 100000-e çenli biletleriň satylyş ýagdaýy</p>
  </div>

  <div class="stats-container">
    <div class="stat-card all">
      <div style="font-size:11px; color:var(--text-muted); font-weight: 600;">JEMI BİLET</div>
      <div class="num" id="stat-total">100000</div>
    </div>
    <div class="stat-card sold">
      <div style="font-size:11px; color:var(--text-muted); font-weight: 600;">SATYLDY</div>
      <div class="num" id="stat-sold">0</div>
    </div>
    <div class="stat-card free">
      <div style="font-size:11px; color:var(--text-muted); font-weight: 600;">BOŞ BİLET</div>
      <div class="num" id="stat-free">100000</div>
    </div>
  </div>

  <div class="controls-card">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Bilet belgisi ýa-da at gözle..." oninput="onSearchChange()">
    </div>
    <div class="filter-buttons">
      <button class="btn-filter active" onclick="setFilter('all', this)">Ählisi</button>
      <button class="btn-filter" onclick="setFilter('free', this)">Boş Biletler</button>
      <button class="btn-filter" onclick="setFilter('sold', this)">Satylanlar</button>
    </div>
  </div>

  <div class="tickets-grid" id="ticketsGrid"></div>

  <div class="pagination-container">
    <button class="btn-page" id="prevBtn" onclick="changePage(-1)">Yza</button>
    <span id="pageInfo" style="font-size:13px; color:var(--text-muted); font-weight: 600;">Sahypa 1</span>
    <button class="btn-page" id="nextBtn" onclick="changePage(1)">Öňe</button>
  </div>

  <footer>
    © 2026 Şansly Bilet Ulgamy. Ähli maglumatlar goralan.
  </footer>
</div>

<script>
  let soldTickets = {};
  const TOTAL_TICKETS = 100000;
  const PAGE_SIZE = 60; // Bir sahypada 60 bilet görkezilýär
  let currentPage = 1;
  let currentFilter = 'all';
  let filteredList = [];

  async function fetchSoldTickets() {
    try {
      const response = await fetch('tickets.json?v=' + new Date().getTime());
      if (response.ok) {
        soldTickets = await response.json();
      }
    } catch (e) {
      console.log('JSON okaýyşda ýalňyşlyk.');
    }
    updateStats();
    applyFilters();
  }

  function updateStats() {
    const soldCount = Object.keys(soldTickets).length;
    document.getElementById('stat-sold').innerText = soldCount;
    document.getElementById('stat-free').innerText = TOTAL_TICKETS - soldCount;
  }

  function applyFilters() {
    const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();
    filteredList = [];

    for (let i = 1; i <= TOTAL_TICKETS; i++) {
      const isSold = !!soldTickets[i];
      const owner = soldTickets[i];

      if (currentFilter === 'free' && isSold) continue;
      if (currentFilter === 'sold' && !isSold) continue;

      if (searchVal !== '') {
        const numStr = i.toString();
        const nameStr = isSold ? owner.name.toLowerCase() : '';
        const phoneStr = isSold ? owner.phone.toLowerCase() : '';

        if (!numStr.includes(searchVal) && !nameStr.includes(searchVal) && !phoneStr.includes(searchVal)) {
          continue;
        }
      }

      filteredList.push(i);
    }

    currentPage = 1;
    renderPage();
  }

  function renderPage() {
    const grid = document.getElementById('ticketsGrid');
    grid.innerHTML = '';

    const totalPages = Math.ceil(filteredList.length / PAGE_SIZE) || 1;
    const startIndex = (currentPage - 1) * PAGE_SIZE;
    const pageItems = filteredList.slice(startIndex, startIndex + PAGE_SIZE);

    pageItems.forEach(i => {
      const isSold = !!soldTickets[i];
      const owner = soldTickets[i];
      const card = document.createElement('div');
      card.className = `ticket-card ${isSold ? 'sold' : 'free'}`;

      if (isSold) {
        card.innerHTML = `
          <div class="ticket-number">#${i}</div>
          <span class="ticket-status">Satyldy</span>
          <div class="owner-info">
            <span>${owner.name}</span>
            <small>${owner.phone}</small>
          </div>
        `;
      } else {
        card.innerHTML = `
          <div class="ticket-number">#${i}</div>
          <span class="ticket-status">Boş</span>
          <div class="owner-info" style="border:none; text-align:center;">
            <small style="color: var(--accent-green);">Boş Bilet</small>
          </div>
        `;
      }
      grid.appendChild(card);
    });

    document.getElementById('pageInfo').innerText = `Sahypa ${currentPage} / ${totalPages}`;
    document.getElementById('prevBtn').disabled = currentPage === 1;
    document.getElementById('nextBtn').disabled = currentPage >= totalPages;
  }

  function changePage(direction) {
    currentPage += direction;
    renderPage();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function setFilter(type, btn) {
    currentFilter = type;
    document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyFilters();
  }

  function onSearchChange() {
    applyFilters();
  }

  fetchSoldTickets();
</script>

</body>
</html>
