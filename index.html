<!DOCTYPE html>
<html lang="tk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bilet Barla - Şansly Bilet Ulgamy</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(22, 31, 49, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.4);
      --accent-green: #10b981;
      --accent-red: #f43f5e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --banner-bg: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(168, 85, 247, 0.2));
    }

    /* GÜNDİZKİ TEMA (LIGHT MODE) */
    body.light-mode {
      --bg-color: #f1f5f9;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(0, 0, 0, 0.08);
      --primary: #4f46e5;
      --primary-glow: rgba(79, 70, 229, 0.25);
      --accent-green: #059669;
      --accent-red: #e11d48;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --banner-bg: linear-gradient(135deg, rgba(79, 70, 229, 0.1), rgba(168, 85, 247, 0.1));
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; transition: background-color 0.3s, color 0.3s, border-color 0.3s; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container { width: 100%; max-width: 950px; }

    /* YÖKARY DOLANDYRYŞ PANAL (DİL WE TEMA) */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .theme-toggle, .lang-select {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    .lang-select option { background: var(--bg-color); color: var(--text-main); }

    /* HOŞ GELDİŇİZ BANNERI (ANIMASIÝALY) */
    .welcome-banner {
      background: var(--banner-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 22px;
      text-align: center;
      margin-bottom: 25px;
      animation: fadeInDown 0.8s ease-out;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }

    .welcome-banner h2 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 6px;
      background: linear-gradient(135deg, var(--primary), #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .welcome-banner p { font-size: 14px; color: var(--text-muted); }

    .header { text-align: center; margin-bottom: 25px; }
    .header h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }

    /* STATS CONTAINER */
    .stats-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      position: relative;
      overflow: hidden;
      animation: zoomIn 0.5s ease;
    }

    .stat-card .num { font-size: 22px; font-weight: 800; margin-top: 6px; }

    /* CONTROLS CARD */
    .controls-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px 20px;
      margin-bottom: 25px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: space-between;
      align-items: center;
    }

    .search-box { flex: 1; min-width: 260px; }
    .search-box input {
      width: 100%;
      background: rgba(0, 0, 0, 0.15);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 18px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
    }

    .search-box input:focus { border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }

    .filter-buttons { display: flex; gap: 8px; }
    .btn-filter {
      background: rgba(0, 0, 0, 0.15);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-filter.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 4px 15px var(--primary-glow);
    }

    /* TICKETS GRID */
    .tickets-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
      gap: 14px;
      min-height: 200px;
    }

    .ticket-card {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px;
      text-align: center;
      position: relative;
      animation: fadeInUp 0.4s ease-out;
    }

    .ticket-card:hover {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 10px 20px var(--primary-glow);
    }

    .ticket-card.free { border-top: 3px solid var(--accent-green); }
    .ticket-card.sold { border-top: 3px solid var(--accent-red); }

    .ticket-number { font-size: 17px; font-weight: 800; margin-bottom: 6px; }
    .ticket-status {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      padding: 4px 10px; border-radius: 20px; display: inline-block; margin-bottom: 10px;
    }

    .free .ticket-status { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); }
    .sold .ticket-status { background: rgba(244, 63, 94, 0.15); color: var(--accent-red); }

    .owner-info {
      font-size: 11px; color: var(--text-muted);
      border-top: 1px dashed var(--card-border); padding-top: 8px; text-align: left;
    }
    .owner-info span { display: block; color: var(--text-main); font-weight: 600; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* PAGINATION */
    .pagination-container { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 35px; }
    .btn-page {
      background: var(--card-bg); border: 1px solid var(--card-border);
      color: var(--text-main); padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: 600;
    }
    .btn-page:hover:not(:disabled) { background: var(--primary); color: #fff; }
    .btn-page:disabled { opacity: 0.3; cursor: not-allowed; }

    footer { text-align: center; color: var(--text-muted); font-size: 12px; margin-top: 40px; padding: 20px 0; }

    /* ANIMASIÝALAR */
    @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes zoomIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>

<div class="container">
  
  <!-- YÖKARY DİL WE TEMA PANAL -->
  <div class="top-bar">
    <button class="theme-toggle" onclick="toggleTheme()">🌙 / ☀️ Mode</button>
    <select class="lang-select" id="langSelect" onchange="changeLanguage(this.value)">
      <option value="tk">Türkmençe</option>
      <option value="ru">Русский</option>
      <option value="en">English</option>
    </select>
  </div>

  <!-- HOŞ GELDİŇİZ BANNERI -->
  <div class="welcome-banner">
    <h2 id="wel-title">Hoş geldiňiz! 🎲</h2>
    <p id="wel-desc">Aşakdaky sanawdan öz biletleriňizi we satylyş ýagdaýyny amatlylyk bilen barlap bilersiňiz.</p>
  </div>

  <div class="header">
    <h1 id="txt-title">BİLET SANAW ULGAMY</h1>
    <p id="txt-subtitle">1-den 100000-e çenli biletleriň satylyş ýagdaýy</p>
  </div>

  <div class="stats-container">
    <div class="stat-card all">
      <div style="font-size:11px; color:var(--text-muted); font-weight: 600;" id="txt-stat-total">JEMI BİLET</div>
      <div class="num" id="stat-total" style="color:var(--primary);">100000</div>
    </div>
    <div class="stat-card sold">
      <div style="font-size:11px; color:var(--text-muted); font-weight: 600;" id="txt-stat-sold">SATYLDY</div>
      <div class="num" id="stat-sold" style="color:var(--accent-red);">0</div>
    </div>
    <div class="stat-card free">
      <div style="font-size:11px; color:var(--text-muted); font-weight: 600;" id="txt-stat-free">BOŞ BİLET</div>
      <div class="num" id="stat-free" style="color:var(--accent-green);">100000</div>
    </div>
  </div>

  <div class="controls-card">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Bilet belgisi ýa-da at gözle..." oninput="onSearchChange()">
    </div>
    <div class="filter-buttons">
      <button class="btn-filter active" id="btn-all" onclick="setFilter('all', this)">Ählisi</button>
      <button class="btn-filter" id="btn-free" onclick="setFilter('free', this)">Boş Biletler</button>
      <button class="btn-filter" id="btn-sold" onclick="setFilter('sold', this)">Satylanlar</button>
    </div>
  </div>

  <div class="tickets-grid" id="ticketsGrid"></div>

  <div class="pagination-container">
    <button class="btn-page" id="prevBtn" onclick="changePage(-1)">Yza</button>
    <span id="pageInfo" style="font-size:13px; color:var(--text-muted); font-weight: 600;">Sahypa 1</span>
    <button class="btn-page" id="nextBtn" onclick="changePage(1)">Öňe</button>
  </div>

  <footer id="txt-footer">
    © 2026 Şansly Bilet Ulgamy. Ähli maglumatlar goralan.
  </footer>
</div>

<script>
  let soldTickets = {};
  const TOTAL_TICKETS = 100000;
  const PAGE_SIZE = 60;
  let currentPage = 1;
  let currentFilter = 'all';
  let filteredList = [];

  // DİLLER DÖZÜMI
  const dictionary = {
    tk: {
      welTitle: "Hoş geldiňiz! 🎲",
      welDesc: "Aşakdaky sanawdan öz biletleriňizi we satylyş ýagdaýyny amatlylyk bilen barlap bilersiňiz.",
      title: "BİLET SANAW ULGAMY",
      subtitle: "1-den 100000-e çenli biletleriň satylyş ýagdaýy",
      statTotal: "JEMI BİLET",
      statSold: "SATYLDY",
      statFree: "BOŞ BİLET",
      searchPlaceholder: "Bilet belgisi ýa-da at gözle...",
      btnAll: "Ählisi",
      btnFree: "Boş Biletler",
      btnSold: "Satylanlar",
      statusSold: "Satyldy",
      statusFree: "Boş",
      freeCard: "Boş Bilet",
      prev: "Yza",
      next: "Öňe",
      page: "Sahypa",
      footer: "© 2026 Şansly Bilet Ulgamy. Ähli maglumatlar goralan."
    },
    ru: {
      welTitle: "Добро пожаловать! 🎲",
      welDesc: "В списке ниже вы можете удобно проверить свои билеты и статус их продажи.",
      title: "СИСТЕМА БИЛЕТОВ",
      subtitle: "Статус продажи билетов от 1 до 100000",
      statTotal: "ВСЕГО БИЛЕТОВ",
      statSold: "ПРОДАНО",
      statFree: "СВОБОДНО",
      searchPlaceholder: "Поиск по номеру или имени...",
      btnAll: "Все",
      btnFree: "Свободные",
      btnSold: "Проданные",
      statusSold: "Продано",
      statusFree: "Свободно",
      freeCard: "Свободный билет",
      prev: "Назад",
      next: "Вперед",
      page: "Страница",
      footer: "© 2026 Система Лотерейных Билетов. Все права защищены."
    },
    en: {
      welTitle: "Welcome! 🎲",
      welDesc: "You can conveniently check your tickets and their sales status from the list below.",
      title: "TICKET SYSTEM",
      subtitle: "Ticket status from 1 to 100000",
      statTotal: "TOTAL TICKETS",
      statSold: "SOLD",
      statFree: "AVAILABLE",
      searchPlaceholder: "Search by ticket number or name...",
      btnAll: "All",
      btnFree: "Available",
      btnSold: "Sold",
      statusSold: "Sold",
      statusFree: "Free",
      freeCard: "Available Ticket",
      prev: "Prev",
      next: "Next",
      page: "Page",
      footer: "© 2026 Lucky Ticket System. All rights reserved."
    }
  };

  let currentLang = 'tk';

  function changeLanguage(lang) {
    currentLang = lang;
    const t = dictionary[lang];

    document.getElementById('wel-title').innerText = t.welTitle;
    document.getElementById('wel-desc').innerText = t.welDesc;
    document.getElementById('txt-title').innerText = t.title;
    document.getElementById('txt-subtitle').innerText = t.subtitle;
    document.getElementById('txt-stat-total').innerText = t.statTotal;
    document.getElementById('txt-stat-sold').innerText = t.statSold;
    document.getElementById('txt-stat-free').innerText = t.statFree;
    document.getElementById('searchInput').placeholder = t.searchPlaceholder;
    document.getElementById('btn-all').innerText = t.btnAll;
    document.getElementById('btn-free').innerText = t.btnFree;
    document.getElementById('btn-sold').innerText = t.btnSold;
    document.getElementById('prevBtn').innerText = t.prev;
    document.getElementById('nextBtn').innerText = t.next;
    document.getElementById('txt-footer').innerText = t.footer;

    renderPage();
  }

  function toggleTheme() {
    document.body.classList.toggle('light-mode');
  }

  async function fetchSoldTickets() {
    try {
      const response = await fetch('tickets.json?v=' + new Date().getTime());
      if (response.ok) {
        soldTickets = await response.json();
      }
    } catch (e) {
      console.log('JSON okaýyşda ýalňyşlyk.');
    }
    updateStats();
    applyFilters();
  }

  function updateStats() {
    const soldCount = Object.keys(soldTickets).length;
    document.getElementById('stat-sold').innerText = soldCount;
    document.getElementById('stat-free').innerText = TOTAL_TICKETS - soldCount;
  }

  function applyFilters() {
    const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();
    filteredList = [];

    for (let i = 1; i <= TOTAL_TICKETS; i++) {
      const isSold = !!soldTickets[i];
      const owner = soldTickets[i];

      if (currentFilter === 'free' && isSold) continue;
      if (currentFilter === 'sold' && !isSold) continue;

      if (searchVal !== '') {
        const numStr = i.toString();
        const nameStr = isSold ? owner.name.toLowerCase() : '';
        const phoneStr = isSold ? owner.phone.toLowerCase() : '';

        if (!numStr.includes(searchVal) && !nameStr.includes(searchVal) && !phoneStr.includes(searchVal)) {
          continue;
        }
      }

      filteredList.push(i);
    }

    currentPage = 1;
    renderPage();
  }

  function renderPage() {
    const grid = document.getElementById('ticketsGrid');
    grid.innerHTML = '';
    const t = dictionary[currentLang];

    const totalPages = Math.ceil(filteredList.length / PAGE_SIZE) || 1;
    const startIndex = (currentPage - 1) * PAGE_SIZE;
    const pageItems = filteredList.slice(startIndex, startIndex + PAGE_SIZE);

    pageItems.forEach(i => {
      const isSold = !!soldTickets[i];
      const owner = soldTickets[i];
      const card = document.createElement('div');
      card.className = `ticket-card ${isSold ? 'sold' : 'free'}`;

      if (isSold) {
        card.innerHTML = `
          <div class="ticket-number">#${i}</div>
          <span class="ticket-status">${t.statusSold}</span>
          <div class="owner-info">
            <span>${owner.name}</span>
            <small>${owner.phone}</small>
          </div>
        `;
      } else {
        card.innerHTML = `
          <div class="ticket-number">#${i}</div>
          <span class="ticket-status">${t.statusFree}</span>
          <div class="owner-info" style="border:none; text-align:center;">
            <small style="color: var(--accent-green);">${t.freeCard}</small>
          </div>
        `;
      }
      grid.appendChild(card);
    });

    document.getElementById('pageInfo').innerText = `${t.page} ${currentPage} / ${totalPages}`;
    document.getElementById('prevBtn').disabled = currentPage === 1;
    document.getElementById('nextBtn').disabled = currentPage >= totalPages;
  }

  function changePage(direction) {
    currentPage += direction;
    renderPage();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function setFilter(type, btn) {
    currentFilter = type;
    document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyFilters();
  }

  function onSearchChange() {
    applyFilters();
  }

  fetchSoldTickets();
</script>

</body>
</html>
