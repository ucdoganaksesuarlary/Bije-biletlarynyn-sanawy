<!DOCTYPE html>
<html lang="tk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Bijeli Oyun</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #121212; color: #fff; }
    .card { background: #1e1e1e; padding: 20px; border-radius: 8px; max-width: 400px; margin: auto; }
    input, select, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 5px; border: none; box-sizing: border-box; }
    button { background: #ff9900; color: #000; font-weight: bold; cursor: pointer; }
    button:hover { background: #e68a00; }
  </style>
</head>
<body>

<div class="card">
  <h2>Bilet Dolandyryş Paneli</h2>
  <label>Bilet ID (1-100):</label>
  <input type="number" id="ticketId" placeholder="Meselem: 5">

  <label>Status:</label>
  <select id="status">
    <option value="Boş">Boş</option>
    <option value="Bilet">Bilet</option>
  </select>

  <label>Ady:</label>
  <input type="text" id="name" placeholder="Maksat">

  <label>Telefon Belgisi:</label>
  <input type="text" id="phone" placeholder="+99365xxxxxx">

  <button onclick="updateTicket()">Ýatda Sakla</button>
  <p id="msg" style="color: #00ff00;"></p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBtxkqUiRNjfhiOsUnJ8B3fpsx0SRQyhZw",
    authDomain: "bijeli-oyun.firebaseapp.com",
    databaseURL: "https://bijeli-oyun-default-rtdb.firebaseio.com",
    projectId: "bijeli-oyun",
    storageBucket: "bijeli-oyun.firebasestorage.app",
    messagingSenderId: "240710083908",
    appId: "1:240710083908:web:4bd2306b93a6ab47fd6311"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  window.updateTicket = function() {
    const id = document.getElementById("ticketId").value;
    const status = document.getElementById("status").value;
    const name = document.getElementById("name").value;
    const phone = document.getElementById("phone").value;

    if (!id) {
      alert("Haýyş, Bilet ID-sini ýazyň!");
      return;
    }

    set(ref(db, 'tickets/' + id), {
      status: status,
      name: name,
      phone: phone
    }).then(() => {
      document.getElementById("msg").innerText = "Bilet " + id + " üstünlikli täzelendi!";
    }).catch((error) => {
      alert("Ýalňyşlyk: " + error.message);
    });
  };
</script>

</body>
</html>
